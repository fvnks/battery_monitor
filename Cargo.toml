[package]
name = "battery_monitor"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.19"
reqwest = { version = "0.12", features = ["blocking", "json"] }
self_update = "0.41"
windows = { version = "0.58", features = [
    "Win32_System_Power",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = 3
lto = true
